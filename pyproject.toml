[project]
name = "shadow-ship-spotter"
version = "0.1.0"
description = "SSS: Shadow Ship Spotter - SAR vessel detection vs AIS (university ML project)"
readme = "README.md"
authors = [{ name = "oscarbonnet", email = "you@example.com" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "polars>=1,<2",
    "pydantic>=2,<3",
    "matplotlib>=3.8,<4.0",
    "scipy>=1.12,<2.0",
    "seaborn>=0.13,<0.14",
    "rasterio>=1.5.2",
    "zarr>=3.4.2",
    "pyarrow>=26.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "black>=24,<25",
    "ipykernel>=7.4.0",
]
lint = [
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
